<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console (verificación por meta etiqueta / propiedad de prefijo de URL) -->
    <meta name="google-site-verification" content="02Y4b26KI86VgeZEbI9PGqyO1EqNGYiN53IYbEz7xkg" />

    <!-- Meta (Facebook) — verificación de dominio para Business Manager -->
    <meta name="facebook-domain-verification" content="vfnaz3487f6uiqph9zujumh69kuy6g" />

    <!-- Default metadata (per-page title/description/canonical/og:* are set in <Seo>) -->
    <meta name="author" content="Santiago Miranda" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#0b0e14" />

    <!-- Favicon & app icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dox Designs · Santiago Miranda" />
    <meta property="og:image" content="https://doxdesigns.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Santiago Miranda — Dox Designs" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://doxdesigns.dev/og-image.jpg" />

    <!-- Fonts are self-hosted via @fontsource (imported in src/main.tsx) -->

    <!-- Datos estructurados: los emite <Seo> por página e idioma (ver
         src/lib/schema.ts). Aquí no queda nada atado a un idioma: el `lang`
         de la etiqueta html, el og:locale, el canonical y los hreflang los pone cada
         página. -->

    <!-- Modo de rendimiento, antes del primer pintado.
         Aquí va SOLO la parte barata —la preferencia guardada y las señales que
         no cuestan nada de leer—, para que el primer frame ya salga en el modo
         correcto y no haya un salto visual al hidratar. El resto de la
         detección (el rasterizador y la sonda de fotogramas) vive en
         src/lib/perf.ts y corre después: no se duplica nada, cada señal está
         en un solo sitio. -->
    <script>
      (function () {
        var d = document.documentElement;
        var guardada = null;
        try {
          guardada = localStorage.getItem("dox:perf");
        } catch (e) {
          /* modo privado */
        }
        if (guardada === "low" || guardada === "high") {
          d.dataset.perf = guardada;
          return;
        }
        var n = navigator;
        var bajo =
          (n.hardwareConcurrency || 8) <= 2 ||
          (n.deviceMemory || 8) <= 2 ||
          (n.connection && n.connection.saveData === true);
        d.dataset.perf = bajo ? "low" : "high";
      })();
    </script>
  </head>
  <body>
    <!-- Meta Pixel — fallback para navegadores sin JS. El pixel principal se
         carga desde src/lib/analytics.ts (no inline, para respetar la CSP). -->
    <noscript
      ><img
        height="1"
        width="1"
        style="display: none"
        alt=""
        src="https://www.facebook.com/tr?id=1908259770134955&ev=PageView&noscript=1"
    /></noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
